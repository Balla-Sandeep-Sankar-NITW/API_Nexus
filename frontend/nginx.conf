server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unmatched paths fall back to index.html so client-side
    # routing (React Router) handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: uncomment and point at your backend to avoid setting
    # VITE_API_BASE_URL at all, keeping the API same-origin in production too.
    # location /api/ {
    #     proxy_pass http://backend:8000/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
